data_dir: "./datasets"
train_gender: both
test_gender: both

model: DepMambaMultiEncoderEnsemble
dataset: dvlog #dvlog or lmvd
train: true
epochs: 120
batch_size: 16
learning_rate: 8e-5
lr_scheduler: cos
if_wandb: false
tqdm_able: false
save_dir: "./results/"
gpu: "0"
device:
  - "cuda"

# Ensemble specific parameters
num_encoders: 3
# ensemble_stage: 'early' = Feature fusion 후 단일 classifier (기존 방식)
# ensemble_stage: 'late' = 각 encoder별 classifier 후 logits ensemble (새로운 방식, 권장)
ensemble_stage: late

# For early ensemble: 'average', 'weighted', 'attention', 'concat'
# For late ensemble: 'average', 'weighted', 'attention', 'voting', 'stacking', 'gating'
fusion_type: weighted

# Diversity loss encourages different encoder behaviors
diversity_loss_weight: 0.01

# Early stopping patience (0 to disable)
early_stopping: 100

# Multi-Encoder parameters for D-Vlog
multiencoder_dvlog:
  audio_input_size: 25 # LDDs for D-Vlog
  video_input_size: 136
  text_input_size: 768 # BERT base hidden size
  mm_input_size: 256
  mm_output_sizes: [256, 64]
  dropout: 0.1
  d_ffn: 1024 
  num_layers: 2
  activation: 'GELU'
  causal: false

  mamba_config:
    d_state: 12 
    expand: 4 
    d_conv: 4 
    bidirectional: true

# Multi-Encoder parameters for LMVD
multiencoder_lmvd:
  audio_input_size: 128 # VGGish for LMVD
  video_input_size: 136
  text_input_size: 768 # BERT base hidden size
  mm_input_size: 256
  mm_output_sizes: [256, 64]
  dropout: 0.1
  d_ffn: 1024 
  num_layers: 2
  activation: 'GELU'
  causal: false

  mamba_config:
    d_state: 16 
    expand: 4 
    d_conv: 4 
    bidirectional: true
