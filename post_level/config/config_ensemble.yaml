data_dir: "./datasets"
train_gender: both
test_gender: both

model: DepMambaMultiEncoderEnsemble
dataset: dvlog #dvlog or lmvd
train: true
epochs: 120
batch_size: 16
learning_rate: 8e-5
lr_scheduler: cos
if_wandb: false
tqdm_able: false
save_dir: "./results/"
gpu: "0"
device:
  - "cuda"

# Ensemble specific parameters
num_encoders: 3
# ensemble_stage: 'early' = feature fusion then a single classifier (original scheme)
# ensemble_stage: 'late' = per-encoder classifiers then logits ensemble (new scheme, recommended)
ensemble_stage: late

# For early ensemble: 'average', 'weighted', 'attention', 'concat'
# For late ensemble: 'average', 'weighted', 'attention', 'voting', 'stacking', 'gating'
fusion_type: weighted

# Diversity loss encourages different encoder behaviors
diversity_loss_weight: 0.01

# Early stopping patience (0 to disable)
early_stopping: 100

# ============================================
# MoE (Mixture of Experts) Parameters
# ============================================
# Post-CoSSM MoE (EnSSM_MoE) - applied after CoSSM on fused features
use_moe: true
num_experts: 3
top_k_experts: 2
moe_loss_weight: 0.01

# Pre-CoSSM FiLM MoE (NEW - Modality-aware Expert)
# Applied before CoSSM to process each modality with FiLM-conditioned experts
# Each expert uses FiLM (Feature-wise Linear Modulation) to be aware of modality type
use_pre_cossm_moe: true
pre_cossm_num_experts: 5      # Number of FiLM experts (recommended: 5)
pre_cossm_top_k: 2            # Number of experts to activate per input
pre_cossm_moe_loss_weight: 0.01  # Load balance loss weight

# Multi-Encoder parameters for D-Vlog
multiencoder_dvlog:
  audio_input_size: 25 # LDDs for D-Vlog
  video_input_size: 136
  text_input_size: 768 # BERT base hidden size
  mm_input_size: 256
  mm_output_sizes: [256, 64]
  dropout: 0.1
  d_ffn: 1024 
  num_layers: 2
  activation: 'GELU'
  causal: false

  mamba_config:
    d_state: 12 
    expand: 4 
    d_conv: 4 
    bidirectional: true

# Multi-Encoder parameters for LMVD
multiencoder_lmvd:
  audio_input_size: 128 # VGGish for LMVD
  video_input_size: 136
  text_input_size: 768 # BERT base hidden size
  mm_input_size: 256
  mm_output_sizes: [256, 64]
  dropout: 0.1
  d_ffn: 1024 
  num_layers: 2
  activation: 'GELU'
  causal: false

  mamba_config:
    d_state: 16 
    expand: 4 
    d_conv: 4 
    bidirectional: true

# ============================================
# Late Ensemble Fusion Types:
# ============================================
# - average: simple mean of logits
# - weighted: learnable weighted mean of logits (recommended)
# - attention: dynamic weights via feature-based attention
# - voting: soft voting (mean of probabilities)
# - stacking: meta-learner learns to combine logits
# - gating: weights from a feature-based gating network
# ============================================
